name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --workspace=cloud-web
      - name: Type Check
        run: npx tsc --noEmit --project cloud-web/tsconfig.json
      - name: Build
        run: npm run build --workspace=cloud-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_CLOUD_WEB_URL: http://localhost:3000

  bundle-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build with bundle analyzer
        run: npm run analyze --workspace=cloud-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_CLOUD_WEB_URL: http://localhost:3000
      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: cloud-web/.next/analyze/
          retention-days: 30

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build --workspace=cloud-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_CLOUD_WEB_URL: http://localhost:3000
      - name: Start server
        run: |
          cd cloud-web
          npx next start -p 3000 &
          sleep 5
      - name: Lighthouse CI
        run: npx @lhci/cli autorun --config=cloud-web/lighthouserc.json
        env:
          LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: cloud-web/.lighthouseci/
          retention-days: 30
