[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gnovium"
version = "0.1.0"
description = "GNOVIUM backend — knowledge operating system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "GNOVIUM", email = "dev@gnovium.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: Flask",
    "Operating System :: OS Independent",
]
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Caching>=2.3.0",
    "Flask-Cors>=4.0.0",
    "Flask-JWT-Extended>=4.6.0",
    "Flask-Limiter>=3.8.0",
    "Flask-Migrate>=4.0.0",
    "SQLAlchemy>=2.0.0",
    "APScheduler>=3.10.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "marshmallow>=3.21.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "requests>=2.32.0",
    "cachetools>=7.1.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "google-auth>=2.29.0",
    "boto3>=1.34.0",
    "psycopg[binary]>=3.2.0",
    "gunicorn>=21.2.0",
]

[project.urls]
Homepage = "https://gnovium.com"
API = "https://api.gnovium.com"
Source = "https://github.com/gnovium/backend"

[tool.vercel]
entrypoint = "wsgi:app"
