<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Loading — Gnovium</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .loader-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: contain;
    }
    .loader-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
    }
    .loader-progress-bar {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .loader-progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .loader-error {
      font-size: 12px;
      color: #ff4444;
      max-width: 300px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="loader">
    <img class="loader-logo" src="gnovium-logo.jpeg" alt="Gnovium" />
    <div class="loader-spinner"></div>
    <div class="loader-progress-bar">
      <div class="loader-progress-fill" id="progressFill"></div>
    </div>
    <div class="loader-text" id="loaderText">Loading Gnovium…</div>
    <div class="loader-error" id="loaderError" style="display:none;"></div>
  </div>

  <script>
    if (window.electronLoading) {
      window.electronLoading.onProgress(function(percent, status) {
        document.getElementById("progressFill").style.width = percent + "%";
        document.getElementById("loaderText").textContent = status || "Loading\u2026";
      });
      window.electronLoading.onComplete(function() {
        document.getElementById("loaderText").textContent = "Ready";
      });
      window.electronLoading.onError(function(message) {
        document.getElementById("loaderError").textContent = message;
        document.getElementById("loaderError").style.display = "block";
        document.getElementById("loaderText").textContent = "Error";
      });
    }
  </script>
</body>
</html>
