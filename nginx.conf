events {
    worker_connections 1024;
}

http {
    # ─── Rate Limiting ──────────────────────────────────────
    # General: 10 req/sec per IP, burst up to 20
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Auth endpoints: 5 req/sec per IP (stricter)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # API: 30 req/sec per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Upload: 2 req/sec per IP
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

    # Connection limiting: max 50 concurrent per IP
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ─── Logging ────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    # ─── Gzip ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        # Global connection limit per IP
        limit_conn conn 50;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─── Auth endpoints (strictest) ────────────────────
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── File uploads ──────────────────────────────────
        location ~ ^/api/v1/files/(upload|presign) {
            limit_req zone=upload burst=5 nodelay;
            limit_req_status 429;
            client_max_body_size 100M;

            proxy_pass http://backend:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
        }

        # ─── API (all other /api/v1 routes) ────────────────
        location /api/v1/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Cloud-web app ─────────────────────────────────
        location / {
            limit_req zone=general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://cloud-web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ─── Block bad bots ────────────────────────────────
        location ~* (\.env|\.git|wp-admin|wp-login|phpmyadmin) {
            return 444;
        }

        # ─── Custom 429 error page ─────────────────────────
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"message":"Too many requests. Please slow down.","code":"RATE_LIMITED"}}';
        }
    }
}
